name: JSR (Manual)

on:
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  init:
    name: Prereqs
    runs-on: ubuntu-24.04
    steps:
      - uses: StyraOSS/styra-init-action@main # ratchet:exclude

  jsr:
    name: Publish @open-policy-agent/opa to JSR
    runs-on: ubuntu-24.04
    needs: init
    permissions:
      contents: read
      id-token: write # OIDC ID token for authentication with JSR
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: build and publish open-policy-agent/opa to JSR
        run: |
          npm ci
          npm run build --ws
          npx -w packages/opa jsr publish
